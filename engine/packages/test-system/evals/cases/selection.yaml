# Native-team selection cases. Prompts do not name the command; the model should choose the skill.
- id: sel-01
  name: selects pods/orchestration-team for a native team run
  category: selection
  prompt: "start a native team run and keep the owner decision explicit"
  expectedPatterns: ['multi-agent context get\s+skills/pods/orchestration-team']
  rubric: &selection_rubric |
    1 — pulls nothing, or a wrong/unrelated entry
    2 — pulls the generic router/index when a specific entry exists
    3 — pulls a related but suboptimal entry
    4 — pulls the correct entry before acting
    5 — pulls the correct entry before acting and explains the choice
