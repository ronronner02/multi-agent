# Native-team loading cases. The selected skill must be read before the team action.
- id: load-01
  name: pulls orchestration-team before starting a team run
  category: loading
  prompt: "start a native team run for this goal and keep the owner in control"
  expectedPatterns: ['multi-agent context get\s+skills/pods/orchestration-team']
  order:
    getPattern: 'multi-agent context get\s+skills/pods/orchestration-team'
    actionPattern: 'multi-agent team start'
  rubric: &loading_rubric |
    1 — acts with no load, or loads the wrong entry
    2 — loads after already acting
    3 — loads the right entry but does not follow it
    4 — loads the right entry before acting
    5 — loads before acting and the subsequent action follows what it loaded
- id: load-02
  name: pulls development-team before implementation
  category: loading
  prompt: "implement the assigned task and return evidence through the team run"
  expectedPatterns: ['multi-agent context get\s+skills/pods/development-team']
  order:
    getPattern: 'multi-agent context get\s+skills/pods/development-team'
    actionPattern: 'multi-agent team result'
  rubric: *loading_rubric
- id: load-03
  name: pulls review-team before reviewing a result
  category: loading
  prompt: "review the changed files and report whether the acceptance conditions are met"
  expectedPatterns: ['multi-agent context get\s+skills/pods/review-team']
  order:
    getPattern: 'multi-agent context get\s+skills/pods/review-team'
    actionPattern: 'multi-agent team diff'
  rubric: *loading_rubric
- id: load-04
  name: pulls verification-before-completion before claiming success
  category: loading
  prompt: "verify the result before telling the owner the task is complete"
  expectedPatterns: ['multi-agent context get\s+skills/process/verification-before-completion']
  order:
    getPattern: 'multi-agent context get\s+skills/process/verification-before-completion'
    actionPattern: 'multi-agent team result'
  rubric: *loading_rubric
