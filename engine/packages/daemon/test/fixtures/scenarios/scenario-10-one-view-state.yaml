# Scenario #10 — one-view-state consistency (the 5.1 crowning assertion).
#
# INTENT: at a single point in time the shipped surfaces must AGREE about one
# world. This is the automated form of the failure class that costs real time —
# one surface confidently reporting a world another surface cannot see.
#
# WHAT IS COMPARED, and why these two: `multi-agent ps` and `multi-agent queue` are both
# daemon-truth surfaces, so the rigs ps reports and the rigs the queue's items are
# destined for must be the SAME SET. A qitem addressed to a multi-agent ps does not know
# about — or a rig running with its queue work invisible — breaks this and fails
# the scenario. The declarative mapping below is what makes the comparison
# possible: the surfaces answer in different shapes (rig records vs qitems whose
# destinationSession is <pod>-<member>@<rig>), so each DECLARES the field carrying
# the shared truth. Per A-N1 the mapping is the only scenario-facing form; it
# lowers to the runner-internal seam.
scenario: one-view-state-consistency
topology: ./topo-stub-baton.yaml
env:
  # give the queue a real item so both surfaces have a rig to agree about; an
  # all-empty comparison would pass without proving anything
  queue:
    - id: view-1
      source: harness@scn-baton
      destination: dev-worker@scn-baton
      summary: "#10 one-view-state — the queue's rig must be a multi-agent ps knows"
      claim: true
steps:
  - up: {}
  # THE INVARIANT: ps and queue name the same rig set
  - expect:
      surface: ps
      within: 20s
      equals:
        ps: { pluck: name }
        queue: { pluck: destinationSession, rig: true }
  - down: {}
