<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Multi-Agent</title>
    <style>
      :root {
        --bg: #151619;
        --surface: #1c1d21;
        --line: #2c2d34;
        --text: #ededf0;
        --muted: #999ba6;
        --accent: #818cf8;
        --ok: #34d399;
        --bad: #f87171;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); }
      body {
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        font-size: 14px; color: var(--text);
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 72px 32px 32px;
      }
      .titlebar {
        position: fixed; inset: 0 0 auto; height: 48px; padding: 0 154px 0 24px;
        display: flex; align-items: center; background: var(--bg); border-bottom: 1px solid var(--line);
        font-size: 13px; font-weight: 600; user-select: none; -webkit-app-region: drag;
      }
      section { width: 100%; max-width: 620px; }
      h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
      .sub { color: var(--muted); margin: 0 0 28px; line-height: 1.55; }
      .panel {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 6px; padding: 20px;
      }
      .panel p { margin: 0 0 12px; line-height: 1.6; }
      .panel p:last-child { margin-bottom: 0; }
      .muted { color: var(--muted); }
      code {
        font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px;
        background: #24252b; border: 1px solid var(--line); border-radius: 4px;
        padding: 1px 5px; color: var(--text);
      }
      ul.dependencies { list-style: none; margin: 0; padding: 0; }
      ul.dependencies li {
        display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: baseline;
        padding: 8px 0; border-top: 1px solid var(--line);
      }
      ul.dependencies li:first-child { border-top: 0; padding-top: 0; }
      ul.dependencies li:last-child { padding-bottom: 0; }
      .mark { font-weight: 700; }
      .mark.ok { color: var(--ok); }
      .mark.bad { color: var(--bad); }
      .path { display: block; font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
      .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
      button {
        font: inherit; font-size: 13px; height: 32px; padding: 0 14px;
        border-radius: 6px; border: 1px solid var(--line);
        background: #24252b; color: var(--text); cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: #3a3b44; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #14151a; font-weight: 600; }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <header class="titlebar">Multi-Agent</header>
    <section>
      <h1 id="title">Starting Multi-Agent</h1>
          <div class="panel" id="panel"></div>
      <div class="actions" id="actions"></div>
    </section>
    <script>
      const api = window.multiAgentDesktop;
      const BUSY = ['checking', 'starting', 'pairing'];

      const PANELS = {
        checking: () => '<p>Starting the local engine…</p>',
        starting: () => '<p>Starting the local engine…</p>',
        pairing: () => '<p>Connecting this window to the local engine…</p>',
        'start-failed': () => '<p>The local engine did not start.</p>',
        'engine-missing': () => '<p>The engine build is missing.</p>',
        'connection-failed': () => '<p>The window could not connect to the local engine.</p>',
        'engine-exited': () => '<p>The local engine stopped.</p>',
        stopped: () => '<p>The local engine is stopped.</p>',
        ready: () => '<p>The team view is loading.</p>',
        unknown: () => '<p>The check did not finish.</p>',
      };

      const BUTTONS = {
        'start-failed': [['Reconnect', 'reconnect-engine', true]],
        'engine-missing': [['Reconnect', 'reconnect-engine', true]],
        'connection-failed': [['Reconnect', 'reconnect-engine', true]],
        'engine-exited': [['Reconnect', 'reconnect-engine', true]],
        stopped: [['Reconnect', 'reconnect-engine', true]],
        unknown: [['Reconnect', 'reconnect-engine', true]],
      };

      function row(item) {
        const line = document.createElement('li');
        const mark = document.createElement('span');
        mark.className = 'mark ' + (item.ok ? 'ok' : 'bad');
        mark.textContent = item.ok ? '✓' : '✕';
        const body = document.createElement('div');
        const name = document.createElement('div');
        name.textContent = item.label;
        body.appendChild(name);
        if (item.ok) {
          const resolved = document.createElement('code');
          resolved.className = 'path';
          resolved.textContent = item.path;
          body.appendChild(resolved);
        } else {
          const hint = document.createElement('span');
          hint.className = 'path';
          hint.textContent = item.hint;
          body.appendChild(hint);
        }
        line.appendChild(mark);
        line.appendChild(body);
        return line;
      }

      function dependenciesPanel(items) {
        const list = document.createElement('ul');
        list.className = 'dependencies';
        list.setAttribute('aria-label', 'Dependencies');
        for (const item of items) list.appendChild(row(item));
        return list;
      }

      function render(next) {
        if (!next) return;
        const ready = next.phase === 'ready';
        document.getElementById('title').textContent = ready ? 'Opening Multi-Agent' : 'Starting Multi-Agent';
        const panel = document.getElementById('panel');
        panel.innerHTML = (PANELS[next.phase] || PANELS.unknown)();
        if (Array.isArray(next.dependencies) && next.dependencies.length) panel.appendChild(dependenciesPanel(next.dependencies));

        const actions = document.getElementById('actions');
        actions.innerHTML = '';
        const busy = BUSY.includes(next.phase);
        for (const [label, action, primary] of BUTTONS[next.phase] || []) {
          const button = document.createElement('button');
          button.textContent = label;
          if (primary) button.className = 'primary';
          button.disabled = busy;
          button.addEventListener('click', async () => {
            for (const other of actions.querySelectorAll('button')) other.disabled = true;
            render(await api.run(action));
          });
          actions.appendChild(button);
        }
      }

      document.addEventListener('desktop-status', event => render(event.detail));
      if (api) {
        api.status().then(status => render(status));
        api.onStatus(render);
      }
    </script>
  </body>
</html>
